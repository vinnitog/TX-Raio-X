name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build public allowlist
        shell: bash
        run: |
          mkdir -p _site/js
          cp index.html privacidade.html termos.html manifest.webmanifest sw.js _site/
          cp -R css icons _site/
          cp js/app.mjs js/auth-config.mjs js/auth-controller.mjs js/auth-service.mjs js/privacy-client.mjs _site/js/
          cp js/checkout-client.mjs js/checkout-flow.mjs js/config.mjs _site/js/
          cp js/credit-client.mjs js/demo-analysis.mjs js/history-client.mjs _site/js/
          cp js/supabase-client.mjs js/usage.mjs _site/js/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
